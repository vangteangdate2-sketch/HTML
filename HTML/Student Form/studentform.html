<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Form</title>
    <script src="studentform.js"></script>
</head>

<body>

    <h1>Student Marks Form</h1>

    <form>

        <label>Student ID:</label>
        <input type="text" id="sid" required>
        <br><br>

        <label>Student Name:</label>
        <input type="text" id="sname" required>
        <br><br>

        <label>Business Information System:</label>
        <input type="number" id="sub1" required>
        <br><br>

        <label>Business Math:</label>
        <input type="number" id="sub2" required>
        <br><br>

        <label>AI Development:</label>
        <input type="number" id="sub3" required>
        <br><br>

        <label>Total Marks:</label>
        <input type="number" id="total" readonly>
        <br><br>

        <label>Average:</label>
        <input type="text" id="average" readonly>
        <br><br>

        <label>Grade:</label>
        <input type="text" id="grade" readonly>
        <br><br>

        <button type="button" onclick="storeStudent()">Submit</button>

    </form>

</body>
</html>
