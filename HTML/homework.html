<!DOCTYPE html>
<html>
<head>
<title>Employee Registration Form</title>
</head>
<body>

<h2>Employee Registration Form</h2>

<form>

  <label>Name:</label><br>
  <input type="text" name="name"><br><br>

  <label>Age:</label><br>
  <input type="number" name="age"><br><br>

  <label>Gender:</label><br>
  <input type="radio" name="gender" value="Male"> Male
  <input type="radio" name="gender" value="Female"> Female
  <input type="radio" name="gender" value="Other"> Other
  <br><br>

  <label>Qualification:</label><br>
  <select name="qualification">
    <option value="">-- Select --</option>
    <option value="High School">High School</option>
    <option value="Diploma">Diploma</option>
    <option value="Bachelor's Degree">Bachelor's Degree</option>
    <option value="Master's Degree">Master's Degree</option>
    <option value="PhD">PhD</option>
  </select><br><br>

  <label>Date of Joining:</label><br>
  <input type="date" name="doj"><br><br>

  <label>Resume Upload:</label><br>
  <input type="file" name="resume"><br><br>

  <label>Contact Address:</label><br>
  <textarea name="address" rows="3" cols="30"></textarea><br><br>

  <label>Email:</label><br>
  <input type="email" name="email"><br><br>

  <label>Contact No:</label><br>
  <input type="tel" name="contact"><br><br>

  <label>Alternative No:</label><br>
  <input type="tel" name="altcontact"><br><br>

  <h3>Reference 1</h3>
  <label>Name:</label><br>
  <input type="text" name="ref1name"><br><br>
  <label>Email:</label><br>
  <input type="email" name="ref1email"><br><br>
  <label>Mobile No:</label><br>
  <input type="tel" name="ref1mobile"><br><br>

  <h3>Reference 2</h3>
  <label>Name:</label><br>
  <input type="text" name="ref2name"><br><br>
  <label>Email:</label><br>
  <input type="email" name="ref2email"><br><br>
  <label>Mobile No:</label><br>
  <input type="tel" name="ref2mobile"><br><br>

  <input type="checkbox" name="terms"> I agree to the terms and conditions
  <br><br>

  <button type="submit">Enter</button>
  <button type="button">Exit</button>
  <button type="button">First</button>
  <button type="button">Previous</button>
  <button type="button">Next</button>
  <button type="button">Last</button>
  <button type="button">Delete</button>

</form>

</body>
</html>
