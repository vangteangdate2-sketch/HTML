<html>
    <head>
        <title>Products</title>
        <script src="products.js"></script>
    </head>
    <body>
        <h1>Product Detail Registration Form</h1>
        <form>
            <label>Product ID:</label>
            <input type="text" id="pid" required>
            <br><br>

            <label>Product Name:</label>
            <input type="text" id="pname" required>
            <br><br>

            <label>Date of Purchase:</label>
            <input type="date" id="Date" required>
            <br><br>

            <label>Quantity:</label>
            <input type="number" id="quantity" required>
            <br><br>

            <label>Quality: </label>
            <select id="quality">
                <option value="Select">Select</option>
                <option value="A Grade">A Grade</option>
                <option value="B Grade">B Grade</option>
                <option value="First Quality">First Quality</option>
            </select>
            <br><br>

            <label>Price:</label>
            <input type="number" id="Price" required>
            <br><br>

            <label>Total Amount:</label>
            <input type="number" id="Totalamount" required>
            <br><br>

            <button type="button" onclick="storeproducts()">Submit</button>

        </form>
    </body>
</html>
