<html>
    <head>
        <title>Student Registration Form</title>
    </head>
    <body>
        <center>
            <h1>Student Registration Form</h1>

            <form>
                <label><b>Student Name:</b></label>
                <input type="text" placeholder="Enter your full Name"><br><br>
                <label><b>Student ID:</b></label>
                <input type="text" placeholder="Enter your Student ID"><br><br>
                <label><b>Email Address:</b></label>
                <input type="email" placeholder="Enter your Email Address"><br><br>
                <label><b>Password:</b></label>
                <input type="password" placeholder="Enter your Password"><br><br>
                <label><b>Date of Birth:</b></label>
                <input type="date">
                &nbsp;
                <label><b>Age:</b></label>
                <input type="number" placeholder="Enter your Age"><br><br>

                <label><b>Gender:</b></label>
                <input type="radio" name="Gender">Male
                <input type="radio" name="Gender">Female
                <input type="radio" name="Gender">Other
                <br><br>

                <label><b>Select Course:</b></label>

            <select>
                <option>Select</option>
                <option>Bachelor of Computer Science</option>
                <option>Bachelor of Information Technology</option>
                <option>Bachelor of Business Administration</option>
                <option>Bachelor of Accounting</option>
            </select>
            <br><br>

            <label><b>Skills:</b></label>
                <input type="checkbox"> HTML
                <input type="checkbox"> CSS
                <input type="checkbox"> JavaScript
                <input type="checkbox"> Python
                <br><br>
            
            <label><b>Address</b></label>

            </form>
            </center>
        </body>
</html>
